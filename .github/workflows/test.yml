name: Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  docker-build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build
        uses: docker/build-push-action@v4
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: dtext

  test:
    runs-on: ubuntu-22.04
    needs:
      - docker-build
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prep Docker Image
        uses: ./.github/prepare-docker-image

      - name: Compile extension (rake compile)
        run: $DOCKER_RUN bundle exec rake compile

      - name: Run tests
        run: $DOCKER_RUN bundle exec rake test
